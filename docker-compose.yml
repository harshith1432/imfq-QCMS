version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: qcms_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: qcms-backend:${QCMS_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms_backend
    security_opt:
      - no-new-privileges:true
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms_celery_worker
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    image: qcms-frontend:${QCMS_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qcms_frontend
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  redis_data:
