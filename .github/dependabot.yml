version: 2
updates:
  # ── Frontend NPM Dependencies ───────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
    reviewers:
      - "harshith1432"
    versioning-strategy: "increase"

  # ── Backend Python Dependencies ─────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "python"
      - "security"
    reviewers:
      - "harshith1432"
    versioning-strategy: "increase"

  # ── Root Python Dependencies ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-root)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "harshith1432"

  # ── GitHub Actions Workflows ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci-actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
      - "github-actions"
