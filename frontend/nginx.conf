server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Never cache HTML pages so users always get the latest scripts and entry points
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ =404;
    }

    # Cache static hashed assets permanently (1 year, immutable)
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Main application routing fallback
    location / {
        # Ensure fallback HTML requests are not aggressively cached
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /auth$uri /dashboard$uri /projects$uri /admin$uri /analytics$uri /index.html;
    }

    # Reverse proxy API requests to backend
    location /api {
        proxy_pass http://backend:5000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable HTTP/1.1 for connection keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Reverse proxy uploads directly to backend upload directory
    location /uploads {
        proxy_pass http://backend:5000/uploads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
