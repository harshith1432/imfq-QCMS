<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Performance & Network Acceleration: CDN Preconnect & Critical Preloads -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="preload" href="/assets/dist/core.3ebcd984.min.css" as="style">
    <link rel="preload" href="/assets/dist/auth-guard.4f95cd84.min.js" as="script">
    <script src="/assets/dist/auth-guard.4f95cd84.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | QCMS Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/dist/core.3ebcd984.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: var(--ds-bg-mesh);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .reset-card {
            max-width: 520px;
            width: 100%;
            margin: 2rem auto;
            padding: var(--ds-space-12) !important;
        }
        .password-field-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            color: var(--ds-text-tertiary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 10;
        }
        .password-toggle:hover { color: var(--ds-accent); }
        .ds-input { padding-right: 3rem !important; }

        /* Password strength meter */
        .strength-bar-track {
            height: 4px;
            border-radius: 4px;
            background: var(--ds-border-color);
            overflow: hidden;
            margin-top: 8px;
        }
        .strength-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.35s ease, background 0.35s ease;
            width: 0%;
        }
        .strength-label {
            font-size: 0.73rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .rule-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }
        .rule-list li {
            font-size: 0.78rem;
            color: var(--ds-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            transition: color 0.2s;
        }
        .rule-list li .rule-icon { width: 14px; height: 14px; flex-shrink: 0; }
        .rule-list li.pass  { color: #22c55e; font-weight: 600; }
        .rule-list li.pass .rule-icon, .rule-list li.pass svg { color: #22c55e !important; stroke: #22c55e !important; }
        .rule-list li.fail  { color: var(--ds-text-tertiary); font-weight: 400; }
        .rule-list li.fail .rule-icon, .rule-list li.fail svg { color: var(--ds-text-tertiary) !important; stroke: var(--ds-text-tertiary) !important; }
        .rule-list li.error { color: #ef4444; font-weight: 600; }

        /* First-login badge */
        .first-login-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 999px;
            background: rgba(var(--ds-accent-rgb), 0.12);
            color: var(--ds-accent);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="fade-in">
    <div class="reset-card glass-card fade-in-up">
        <div class="text-center mb-5">
            <div style="width:56px;height:56px;border-radius:16px;background:rgba(var(--ds-accent-rgb), 0.1);color:var(--ds-accent);display:flex;align-items:center;justify-content:center;margin:0 auto var(--ds-space-4);border: 1px solid rgba(var(--ds-accent-rgb), 0.2);">
                <i data-lucide="key-round" style="width:28px;height:28px;"></i>
            </div>
            <div class="first-login-badge" id="firstLoginBadge">
                <i data-lucide="shield-alert" style="width:13px;height:13px;"></i>
                First Login
            </div>
            <h2 class="fw-850 mb-2" id="pageHeading">Set Your Personal Password</h2>
            <p class="text-muted" id="pageSubtitle">
                Your account was created with a default password <strong>Welcome@123</strong>.<br>
                Please set your own secure password to continue.
            </p>
        </div>

        <div id="errorMsg" class="ds-toast error mb-4" style="display:none !important; width: 100%; min-width: auto; animation: none;">
            <i data-lucide="alert-circle"></i>
            <span></span>
        </div>

        <form id="resetForm" novalidate>
            <!-- New Password -->
            <div class="ds-field mb-4">
                <label class="ds-label">
                    <i data-lucide="lock" class="me-2"></i> New Password <span class="text-danger">*</span>
                </label>
                <div class="password-field-group">
                    <input type="password" class="ds-input" id="new_password"
                        placeholder="Create a strong password" required autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('new_password', this)">
                        <i data-lucide="eye" style="width:18px;height:18px;"></i>
                    </button>
                </div>
                <!-- Strength meter -->
                <div class="strength-bar-track">
                    <div class="strength-bar-fill" id="strengthBar"></div>
                </div>
                <div class="strength-label" id="strengthLabel" style="color: var(--ds-text-tertiary);">
                    Enter a password
                </div>
                <ul class="rule-list" id="ruleList">
                    <li id="rule-len"     class="fail"><i data-lucide="circle" class="rule-icon"></i> At least 8 characters</li>
                    <li id="rule-upper"   class="fail"><i data-lucide="circle" class="rule-icon"></i> One uppercase letter (A-Z)</li>
                    <li id="rule-num"     class="fail"><i data-lucide="circle" class="rule-icon"></i> One number (0-9)</li>
                    <li id="rule-special" class="fail"><i data-lucide="circle" class="rule-icon"></i> One special character (!@#$...)</li>
                </ul>
            </div>

            <!-- Confirm Password -->
            <div class="ds-field mb-4">
                <label class="ds-label">
                    <i data-lucide="shield-check" class="me-2"></i> Confirm New Password <span class="text-danger">*</span>
                </label>
                <div class="password-field-group">
                    <input type="password" class="ds-input" id="confirm_password"
                        placeholder="Re-enter password" required autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)">
                        <i data-lucide="eye" style="width:18px;height:18px;"></i>
                    </button>
                </div>
                <div id="matchHint" style="font-size:0.76rem; margin-top:5px;"></div>
            </div>

            <button type="submit" class="ds-btn ds-btn-primary w-100 py-3 ds-btn-lg mt-2"
                id="submitBtn">
                <i data-lucide="check-circle" class="me-2" style="width:18px;height:18px;"></i>
                Set Password &amp; Continue
            </button>
        </form>
    </div>

    <script src="/assets/dist/core-bundle.e907ecc3.min.js"></script>
    <script src="/assets/dist/enterprise-validator.e89a83c2.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();

        // ── Toggle password visibility ────────────────────────────────
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon  = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            if (window.lucide) lucide.createIcons();
        }

        // ── Detect context (first-login vs forgot-password) ───────────
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            document.getElementById('firstLoginBadge').style.display = 'none';
            document.getElementById('pageHeading').textContent   = 'Reset Password';
            document.getElementById('pageSubtitle').textContent  = 'Set a new password to regain access to your account.';
        }

        // ── Password strength rules ───────────────────────────────────
        const rules = {
            len:     { el: document.getElementById('rule-len'),     name: 'at least 8 characters',          test: v => v.length >= 8 },
            upper:   { el: document.getElementById('rule-upper'),   name: 'one uppercase letter (A-Z)',      test: v => /[A-Z]/.test(v) },
            num:     { el: document.getElementById('rule-num'),     name: 'one number (0-9)',               test: v => /[0-9]/.test(v) },
            special: { el: document.getElementById('rule-special'), name: 'one special character (!@#$...)', test: v => /[^a-zA-Z0-9\s]/.test(v) }
        };

        const strengthBar   = document.getElementById('strengthBar');
        const strengthLabel = document.getElementById('strengthLabel');
        const submitBtn     = document.getElementById('submitBtn');
        const errorMsgContainer = document.getElementById('errorMsg');

        function showError(msg) {
            errorMsgContainer.querySelector('span').textContent = msg;
            errorMsgContainer.style.setProperty('display', 'flex', 'important');
        }

        function hideError() {
            errorMsgContainer.style.setProperty('display', 'none', 'important');
        }

        const strengthConfig = [
            { label: 'Too weak',    color: '#ef4444', width: '20%'  },
            { label: 'Weak',        color: '#f97316', width: '40%'  },
            { label: 'Fair',        color: '#eab308', width: '60%'  },
            { label: 'Strong',      color: '#22c55e', width: '80%'  },
            { label: 'Very Strong', color: '#06b6d4', width: '100%' }
        ];

        function updateStrength() {
            hideError();
            const val = document.getElementById('new_password').value;
            let score = 0;
            Object.values(rules).forEach(r => {
                const pass = r.test(val);
                r.el.className = pass ? 'pass' : 'fail';
                const iconEl = r.el.querySelector('.rule-icon');
                if (iconEl) {
                    iconEl.setAttribute('data-lucide', pass ? 'check-circle' : 'circle');
                }
                if (pass) score++;
            });
            if (window.lucide) lucide.createIcons();

            if (!val) {
                strengthBar.style.width = '0%';
                strengthLabel.textContent  = 'Enter a password';
                strengthLabel.style.color  = 'var(--ds-text-tertiary)';
            } else {
                const cfg = strengthConfig[Math.max(0, score - 1)];
                strengthBar.style.width      = cfg.width;
                strengthBar.style.background = cfg.color;
                strengthLabel.textContent    = cfg.label;
                strengthLabel.style.color    = cfg.color;
            }
            checkReady();
        }

        function checkReady() {
            const newPw  = document.getElementById('new_password').value;
            const confPw = document.getElementById('confirm_password').value;
            const matchHint = document.getElementById('matchHint');
            const matches = newPw && confPw && newPw === confPw;

            if (confPw) {
                matchHint.innerHTML = matches
                    ? '<span style="color:#22c55e;font-weight:600;">✓ Passwords match</span>'
                    : '<span style="color:#ef4444;font-weight:600;">✗ Passwords do not match</span>';
            } else {
                matchHint.textContent = '';
            }
        }

        document.getElementById('new_password').addEventListener('input', updateStrength);
        document.getElementById('confirm_password').addEventListener('input', () => {
            hideError();
            checkReady();
        });

        // ── Form submit ───────────────────────────────────────────────
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const newPassword = document.getElementById('new_password').value;
            const confirm     = document.getElementById('confirm_password').value;

            if (!newPassword) {
                showError('Please enter a new password.');
                document.getElementById('new_password').focus();
                return;
            }

            // Validate all password criteria
            const missingRules = [];
            Object.values(rules).forEach(r => {
                if (!r.test(newPassword)) {
                    missingRules.push(r.name);
                    r.el.className = 'error';
                    r.el.querySelector('i').setAttribute('data-lucide', 'alert-circle');
                }
            });
            if (window.lucide) lucide.createIcons();

            if (missingRules.length > 0) {
                showError('Password does not meet requirements. Missing: ' + missingRules.join(', ') + '.');
                document.getElementById('new_password').focus();
                return;
            }

            if (!confirm) {
                showError('Please confirm your new password.');
                document.getElementById('confirm_password').focus();
                return;
            }

            if (newPassword !== confirm) {
                showError('Passwords do not match. Please re-enter matching passwords.');
                document.getElementById('confirm_password').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled  = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Saving...';

            try {
                if (token) {
                    // Forgot Password flow — email reset token
                    await api.post('/auth/reset-password-confirm', {
                        token:        token,
                        new_password: newPassword
                    });
                } else {
                    let currentUser = {};
                    try {
                        currentUser = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
                    } catch (_) {}

                    const storedToken = localStorage.getItem('token') || localStorage.getItem('access_token') || sessionStorage.getItem('token') || sessionStorage.getItem('access_token') || '';
                    const rememberedUsername = localStorage.getItem('qcms_remembered_username') || '';

                    // First-login flow — pass auth token and user identifiers
                    await api.post('/auth/reset-password', {
                        password: newPassword,
                        user_id: currentUser.id || undefined,
                        username: currentUser.username || rememberedUsername || undefined,
                        email: currentUser.email || undefined,
                        auth_token: storedToken || undefined
                    });
                }

                // Force fresh login with new credentials
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = 'login.html?reset=1';

            } catch (err) {
                showError(err.message || 'Failed to update password.');
                btn.disabled  = false;
                btn.innerHTML = '<i data-lucide="check-circle" class="me-2" style="width:18px;height:18px;"></i> Set Password &amp; Continue';
                if (window.lucide) lucide.createIcons();
            }
        });
    </script>
</body>
</html>
