        }

            position: relative;
            padding-left: 28px;
            margin-top: 1rem;
        }

        .step-timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 12px;
            bottom: 12px;
            width: 2px;
            background: var(--ds-border-color);
        }

            position: relative;
            padding-bottom: 14px;
        }

            padding-bottom: 0;
        }

            top: 2px;

            height: 24px;

            allowedRoles: ["team-member", "team-leader"],

            init() {
                this.detectUserRole();
                this.renderRolePills();
                this.renderCases();
            },

            detectUserRole() {
                try {
                    const userStr = sessionStorage.getItem('user') || localStorage.getItem('user');
                    if (userStr) {
                        const u = JSON.parse(userStr);
                        const r = (u.role || u.role_name || '').toLowerCase();
                        
                        let detectedRole = "team-member";
                        if (r.includes("leader")) detectedRole = "team-leader";
                        else if (r.includes("facilitator")) detectedRole = "facilitator";
                        else if (r.includes("reviewer")) detectedRole = "reviewer";
                        else if (r.includes("super")) detectedRole = "super-admin";
                        else if (r.includes("admin")) detectedRole = "admin";
                        else if (r.includes("ceo") || r.includes("exec")) detectedRole = "ceo";
                        else if (r.includes("member")) detectedRole = "team-member";

                        this.userRoleKey = detectedRole;
                        const perm = ROLE_PERMISSIONS[detectedRole] || ROLE_PERMISSIONS["team-member"];
                        this.allowedRoles = perm.allowedRoles;
                        this.currentRoleKey = perm.defaultRole;

                        const badge = document.getElementById('activeUserRoleBadge');
                        if (badge && MANUAL_DATA[this.currentRoleKey]) {
                            badge.textContent = `Your Role: ${MANUAL_DATA[this.currentRoleKey].roleTitle}`;
                        }
                    }
                } catch(e) {
                    console.warn('Could not parse user session:', e);
                }
            },

            renderRolePills() {
                const container = document.getElementById('rolePillsContainer');
                if (!container) return;
                let pillsHtml = '';
                this.allowedRoles.forEach(rKey => {
                    const meta = ROLE_METADATA[rKey];
                    const data = MANUAL_DATA[rKey];
                    if (!meta || !data) return;
                    const isActive = rKey === this.currentRoleKey;
                    pillsHtml += `
                        <button class="role-pill-btn ${isActive ? 'active' : ''}" data-role="${rKey}" onclick="UserManualApp.selectRole('${rKey}')">
                            <i data-lucide="${meta.icon}" style="width:15px;height:15px;"></i>
                            <span>${meta.label}</span>
                            <span class="role-badge-count">${data.cases.length} Cases</span>
                        </button>
                    `;
                });
                container.innerHTML = pillsHtml;
                if (window.lucide) lucide.createIcons();
            },

            selectRole(roleKey) {
                if (!this.allowedRoles.includes(roleKey) || !MANUAL_DATA[roleKey]) return;
                this.currentRoleKey = roleKey;
                
                this.renderRolePills();

                const searchInput = document.getElementById('manualSearchInput');
                if (searchInput) searchInput.value = '';

                this.renderCases();
            },

            filterCases() {
                const query = (document.getElementById('manualSearchInput').value || '').trim().toLowerCase();
                const caseCards = document.querySelectorAll('.manual-case-card');
                let matchCount = 0;

                caseCards.forEach(card => {
                    const text = card.textContent.toLowerCase();
                    const matches = text.includes(query);
                    card.style.display = matches ? 'block' : 'none';
                    if (matches) matchCount++;
                });

                const noResultsEl = document.getElementById('noResultsMessage');
                if (noResultsEl) {
                    noResultsEl.style.display = matchCount === 0 ? 'block' : 'none';
                }
            },

            renderCases() {
                const role = MANUAL_DATA[this.currentRoleKey];
                const container = document.getElementById('casesListContainer');
                if (!role || !container) return;

                let html = `
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <h4 class="mb-0 fw-bold text-main">${role.roleTitle} Manual</h4>
                            <span class="badge ${role.roleBadgeClass} text-xs px-2.5 py-1">${role.cases.length} Standard Operating Cases</span>
                        </div>
                        <p class="text-xs ds-text-secondary mb-0 d-none d-md-block">${role.description}</p>
                    </div>
                `;

                role.cases.forEach(c => {
                    let stepsHtml = '';
                    c.steps.forEach(s => {
                        stepsHtml += `
                            <div class="step-item">
                                <div class="step-badge">${s.num}</div>
                                <div class="step-title">Step ${s.num}: ${s.title}</div>
                                <div class="step-desc">${s.desc}</div>
                            </div>
                        `;
                    });

                    html += `
                        <div class="manual-case-card" id="${c.id}">
                            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 pb-3 border-bottom">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="case-header-tag ${c.tagClass}">Case ${c.caseNumber}</span>
                                    <h5 class="mb-0 fw-bold text-main">${c.title}</h5>
                                </div>
                                <div class="d-flex align-items-center gap-2 no-print">
                                    ${c.actionUrl ? `
                                        <a href="${c.actionUrl}" class="ds-btn ds-btn-primary ds-btn-sm quick-action-btn">
                                            <i data-lucide="external-link" style="width:12px;height:12px;"></i>
                                            ${c.actionText || 'Open Action'}
                                        </a>
                                    ` : ''}
                                </div>
                            </div>

                            <div class="step-timeline">
                                ${stepsHtml}
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div id="noResultsMessage" class="glass-card ds-card p-5 text-center" style="display: none;">
                        <i data-lucide="search-x" style="width:48px;height:48px;" class="text-muted mb-2"></i>
                        <h6 class="fw-bold">No matching cases found</h6>
                        <p class="text-xs ds-text-secondary mb-0">Try searching for different keywords like 'password', 'repository', 'stage', or 'governance'.</p>
                    </div>
                `;

                container.innerHTML = html;
                if (window.lucide) lucide.createIcons();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            UserManualApp.init();
        });
    </script>
</body>

</html>
