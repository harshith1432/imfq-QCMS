version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: qcms_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-qcms_redis_secure_pass}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qcms_redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    image: qcms-backend:${QCMS_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms_backend
    security_opt:
      - no-new-privileges:true
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms_celery_worker
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms_celery_beat
    command: celery -A celery_worker.celery beat --loglevel=info
    security_opt:
      - no-new-privileges:true
    depends_on:
      - celery_worker
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: qcms-frontend:${QCMS_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qcms_frontend
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

volumes:
  redis_data:
