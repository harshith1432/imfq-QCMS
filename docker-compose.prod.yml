version: '3.8'

services:
  backend:
    image: qcms-backend:${QCMS_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  frontend:
    image: qcms-frontend:${QCMS_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qcms_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
